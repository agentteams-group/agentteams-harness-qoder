name: Qoder native contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: 991be8085227933615706cabd984829a053b75a7
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: agentteams-group/agentteams-dashboard
          ref: 96881f2a2a69a06f616c758b04bbddbec08111b8
          path: dashboard
      - run: python -m pip install -e ./harness
      - run: make -C harness test AT_SOURCE=../core
      - run: npm install --prefix /tmp/qoder-dashboard-contract --no-save typescript@5.9.3
      - run: AT_SOURCE=core PYTHONPATH=harness/src:core/shared/lib python harness/tests/dashboard_contract_smoke.py --dashboard dashboard --typescript /tmp/qoder-dashboard-contract/node_modules/typescript
      - run: python -m compileall -q harness/src harness/tests
      - run: bash -n harness/scripts/entrypoint.sh
