name: Qoder native contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: 63eb100e2f553b4cd629288718c898a6d7b3a7ed
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./harness
      - run: make -C harness test AT_SOURCE=../core
      - run: python -m compileall -q harness/src harness/tests
      - run: bash -n harness/scripts/entrypoint.sh
