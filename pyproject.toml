[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentteams-harness-qoder"
version = "0.1.0"
description = "Qoder Agent SDK runtime adapter for AgentTeams"
requires-python = ">=3.11"
dependencies = ["qoder-agent-sdk==1.0.17", "PyYAML>=6.0,<7", "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2"]

[project.scripts]
agentteams-qoder = "agentteams_qoder.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
